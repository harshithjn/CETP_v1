# Measure operator capability and TPC-H runtimes on an x86_64 machine.
#
# WHY THIS EXISTS. Every environment measured so far in this project is arm64 -- the Apple
# M1 laptop and eight Docker cells on that same laptop. The project's central claim is that
# a developer's machine can predict a DIFFERENT production machine, and the one cross-ISA
# experiment available (laptop -> five EC2 x86 instances) showed that no per-machine-scalar
# model can work there: the irreducible MAPE floor is 59.7% and the best measurement reached
# 55.88%, i.e. already at the floor.
#
# Beating that floor needs per-QUERY capability information, which is what per-operator rates
# are. Testing it needs an x86 machine with the SQL probe actually run on it -- the EC2
# instances are terminated, so they cannot supply one. A GitHub Actions runner is x86_64 and
# free for public repositories, so it can.
#
# COMPARABILITY. PostgreSQL runs in the same postgres:15 container image with byte-identical
# settings to scripts/collection/container_grid.py (shared_buffers=128MB,
# effective_cache_size=4GB, work_mem=4MB, max_parallel_workers_per_gather=2,
# random_page_cost=4). The data is TPC-H SF1 generated by DuckDB's dbgen, the same generator
# used for the local data. So the only intended difference from an arm64 grid cell is the
# instruction set and the host hardware.
#
# WHAT IT DOES NOT CONTROL. A shared CI runner is noisy, its storage is network-backed, and
# its vCPU count and neighbours are not ours to fix. The probe's own repeatability gate
# (bootstrap SE of the median) is the guard: if the runner was too busy, the record comes
# back flagged unreliable and must be rerun rather than used.

name: x86 operator probe

on:
  # A workflow_dispatch workflow is only dispatchable once it is on the default branch, so
  # this also fires on a push to the feature branch. That lets the run happen without
  # committing anything to main.
  push:
    branches: [x86-probe]
    paths:
      - '.github/workflows/x86-operator-probe.yml'
      - 'scripts/collection/operator_probe.py'
      - 'scripts/collection/tpch_schema.sql'
  workflow_dispatch:
    inputs:
      reps:
        description: "repetitions per query for the workload collection"
        required: false
        default: "4"
      machine_id:
        description: "machine id to record the signature under"
        required: false
        default: "gha-x86"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest        # x86_64
    timeout-minutes: 90
    env:
      PGPASSWORD: cetp
      PGUSER: postgres
      PGPORT: "55432"
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'gha-x86' }}
      REPS: ${{ github.event.inputs.reps || '4' }}

    steps:
      - uses: actions/checkout@v4

      - name: Record what hardware we actually got
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "arch: $(uname -m)"
            echo "kernel: $(uname -r)"
            echo "nproc: $(nproc)"
            echo "--- /proc/cpuinfo model ---"
            grep -m1 'model name' /proc/cpuinfo || true
            echo "--- memory ---"
            free -m | head -2
            echo "--- disk ---"
            df -h / | tail -1
          } | tee out/host_facts.txt
          test "$(uname -m)" = "x86_64" || { echo "runner is not x86_64"; exit 1; }

      - name: Install client tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet psycopg2-binary duckdb

      - name: Generate TPC-H SF1 with DuckDB
        run: |
          set -euo pipefail
          mkdir -p tpch_csv
          python - <<'PY'
          import duckdb, pathlib
          con = duckdb.connect()
          con.execute("INSTALL tpch; LOAD tpch;")
          con.execute("CALL dbgen(sf=1);")
          out = pathlib.Path("tpch_csv")
          for t in ["region","nation","customer","supplier","part",
                    "partsupp","orders","lineitem"]:
              # '|' delimiter, no header -- matches what \copy expects below and what the
              # local collection used.
              con.execute(
                  f"COPY {t} TO '{out/(t + '.csv')}' "
                  f"(FORMAT CSV, DELIMITER '|', HEADER FALSE)")
              n = con.execute(f"SELECT count(*) FROM {t}").fetchone()[0]
              print(f"{t:10s} {n}")
          PY
          du -sh tpch_csv

      - name: Start PostgreSQL 15 with the grid's exact settings
        run: |
          set -euo pipefail
          docker run -d --name cetp-pg \
            -p ${PGPORT}:5432 \
            -e POSTGRES_PASSWORD=${PGPASSWORD} \
            -v "$PWD/tpch_csv":/csv:ro \
            postgres:15 \
            -c shared_buffers=128MB \
            -c effective_cache_size=4GB \
            -c work_mem=4MB \
            -c max_parallel_workers_per_gather=2 \
            -c random_page_cost=4 \
            -c max_connections=50
          for i in $(seq 1 120); do
            if docker exec cetp-pg pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          docker exec cetp-pg pg_isready -U postgres
          docker exec -e PGPASSWORD=${PGPASSWORD} cetp-pg createdb -U postgres tpch

      - name: Load schema, data and indexes
        run: |
          set -euo pipefail
          # Tables and indexes separately: load into unindexed tables, then build indexes,
          # which is how the local collection did it.
          grep -viE '^create (unique )?index' scripts/collection/tpch_schema.sql \
            > /tmp/schema_tables.sql
          grep -iE '^create (unique )?index' scripts/collection/tpch_schema.sql \
            > /tmp/schema_indexes.sql || true
          docker exec -i -e PGPASSWORD=${PGPASSWORD} cetp-pg \
            psql -U postgres -d tpch -q -v ON_ERROR_STOP=1 < /tmp/schema_tables.sql
          for t in region nation customer supplier part partsupp orders lineitem; do
            docker exec -e PGPASSWORD=${PGPASSWORD} cetp-pg psql -U postgres -d tpch -q \
              -v ON_ERROR_STOP=1 \
              -c "\\copy ${t} from '/csv/${t}.csv' with (format csv, delimiter '|')"
            echo -n "${t}: "
            docker exec -e PGPASSWORD=${PGPASSWORD} cetp-pg \
              psql -U postgres -d tpch -tAc "select count(*) from ${t}"
          done
          docker exec -i -e PGPASSWORD=${PGPASSWORD} cetp-pg \
            psql -U postgres -d tpch -q < /tmp/schema_indexes.sql
          docker exec -e PGPASSWORD=${PGPASSWORD} cetp-pg psql -U postgres -d tpch -c "analyze"
          # Fail loudly if the row count is not the documented SF1 figure.
          n=$(docker exec -e PGPASSWORD=${PGPASSWORD} cetp-pg \
                psql -U postgres -d tpch -tAc "select count(*) from lineitem")
          echo "lineitem rows: $n"
          test "$n" = "6001215" || { echo "SF1 lineitem should be 6001215"; exit 1; }

      - name: Operator capability probe
        run: |
          set -euo pipefail
          python scripts/collection/operator_probe.py \
            --machine-id "${MACHINE_ID}" \
            --db tpch --port "${PGPORT}" --host localhost --user postgres \
            --registry out/operator_signature_x86.json \
            2>&1 | tee out/probe_log.txt

      - name: Collect TPC-H runtimes
        run: |
          set -euo pipefail
          python scripts/collection/collect.py \
            --workload tpch \
            --queries scripts/collection/queries \
            --db tpch --machine-id "${MACHINE_ID}" \
            --reps "${REPS}" --concurrency 1 --scale-factor SF1 \
            --port "${PGPORT}" --host localhost \
            --out "out/tpch_${MACHINE_ID}.csv" \
            --plans-dir out/plans \
            --timeout-ms 600000 2>&1 | tail -20

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          echo "### x86 operator probe" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat out/host_facts.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f out/operator_signature_x86.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          r = json.loads(pathlib.Path("out/operator_signature_x86.json").read_text())
          for m, v in r.items():
              print(f"**{m}** reliable={v.get('reliable')} "
                    f"speedup={v.get('parallel_speedup')}")
              print("```")
              for k, x in sorted(v["rates_tuples_per_s"].items()):
                  print(f"{k:18s} {x:,.0f} tuples/s")
              print("```")
              if v.get("imprecise_probes"):
                  print(f"imprecise: {v['imprecise_probes']}")
          PY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-probe-results
          path: out/
          retention-days: 30

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f cetp-pg || true
